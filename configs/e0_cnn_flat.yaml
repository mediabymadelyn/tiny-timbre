# E0: CNN + flat head (compared against logistic regression on features.csv).
# Run: uv run python -m tiny_timbre.train --config configs/e0_cnn_flat.yaml

name: e0_cnn_flat
head: flat            # flat | gcn
seed: 0

# Optimisation (keep these identical across all experiments)
lr: 0.001
epochs: 20            # revisit after the 1,000-clip sanity run
batch_size: 32

# Data (the training notebook copies both to Colab's local disk first; much faster than Drive)
mels_dir: /content/mels_medium
metadata_dir: /content/fma_metadata
crop_frames: 431                        # 10 s random crops for training; full 30 s for validation
num_workers: 2
# max_train_clips: 1000                 # uncomment for the sanity run

# Saved on Drive so a Colab disconnect doesn't lose the run
checkpoint_path: /content/drive/MyDrive/dl-final/checkpoints/e0_cnn_flat.pt

# Weights & Biases: charts appear live at wandb.ai/<entity>/tiny-timbre while Colab trains
wandb_project: tiny-timbre
wandb_entity: null        # set to your shared W&B team name so everyone sees every run
