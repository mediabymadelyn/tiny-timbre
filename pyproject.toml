[project]
name = "tiny-timbre"
version = "0.1.0"
description = "Multi-label FMA genre tagging: CNN with a flat head vs. a GCN head over the genre hierarchy"
readme = "README.md"
authors = [
    { name = "Maddi Smith", email = "mediabymadelyns@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.0",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "wandb>=0.31.0",
]

[project.scripts]
tiny-timbre = "tiny_timbre:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "torch-geometric>=2.8.1",
]
