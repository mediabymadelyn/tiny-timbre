[project]
name = "tiny-timbre"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maddi Smith", email = "mediabymadelyns@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.0",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "transformers>=5.22.1",
]

[project.scripts]
tiny-timbre = "tiny_timbre:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
